name: Deploy Browser Playtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Ensure single-threaded Web template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ] && [ -f "$HOME/downloads/export_templates.zip" ]; then
            unzip -j -o "$HOME/downloads/export_templates.zip" 'templates/web_nothreads_release.zip' -d "$TEMPLATE_DIR" || true
            unzip -j -o "$HOME/downloads/export_templates.zip" 'web_nothreads_release.zip' -d "$TEMPLATE_DIR" || true
          fi
          echo "Installed export templates:"
          find "$TEMPLATE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-web-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-web-import.log; then
            echo "Godot Web import emitted an engine/parser/resource error"
            exit 1
          fi

      - name: Export browser playtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/web
          godot --headless --verbose --path . --export-release "Web" "build/web/index.html" 2>&1 | tee godot-web-export.log
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Project export .* failed|Failed to load script|Failed loading resource" godot-web-export.log; then
            echo "Godot Web export emitted an engine/parser/resource error"
            exit 1
          fi

      - name: Apply mobile landscape shell
        run: |
          python3 web/patch_mobile_shell.py
          grep -Fq "blackroot-mobile-landscape" build/web/index.html

      - name: Package immutable playtest path
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          PLAYTEST_DIR="build/site/playtest-${SHORT_SHA}"
          mkdir -p "$PLAYTEST_DIR"
          cp -a build/web/. "$PLAYTEST_DIR/"
          touch build/site/.nojekyll
          cat > build/site/index.html <<EOF
          <!doctype html>
          <html><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="pragma" content="no-cache">
          <meta http-equiv="expires" content="0">
          <title>Blackroot Hollow Playtest</title>
          <script>location.replace('./playtest-${SHORT_SHA}/');</script>
          </head><body style="background:#050805;color:#f3ead8;font-family:sans-serif">
          <p>Loading Blackroot Hollow playtest…</p>
          <p><a href="./playtest-${SHORT_SHA}/">Open current build</a></p>
          </body></html>
          EOF
          printf '%s\n' "$SHORT_SHA" > build/site/PLAYTEST_VERSION.txt
          test -f "$PLAYTEST_DIR/index.html"
          test -f "$PLAYTEST_DIR/index.wasm"
          test -f "$PLAYTEST_DIR/index.pck"
          echo "Playtest path: playtest-${SHORT_SHA}/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
