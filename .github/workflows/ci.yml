name: Blackroot Hollow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural verification
        run: python3 tests/verify_structure.py

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        run: godot --version

      - name: Import project headlessly
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-import.log; then
            echo "Godot import emitted an engine/parser/resource error"
            exit 1
          fi

      - name: Runtime smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 20 2>&1 | tee godot-runtime.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource" godot-runtime.log; then
            echo "Godot runtime emitted an engine/parser/resource error"
            exit 1
          fi

      - name: Core architecture smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/core_architecture_smoke.gd 2>&1 | tee godot-core-smoke.log
          grep -Fq "BLACKROOT CORE ARCHITECTURE SMOKE PASSED" godot-core-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT CORE ARCHITECTURE SMOKE FAILED" godot-core-smoke.log; then
            echo "Core architecture smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Art framework smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/art_framework_smoke.gd 2>&1 | tee godot-art-smoke.log
          grep -Fq "BLACKROOT ART FRAMEWORK SMOKE PASSED" godot-art-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|BLACKROOT ART FRAMEWORK SMOKE FAILED" godot-art-smoke.log; then
            echo "Art framework smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Story continuity smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/story_smoke.gd 2>&1 | tee godot-story-smoke.log
          grep -Fq "BLACKROOT STORY SMOKE PASSED" godot-story-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT STORY SMOKE FAILED" godot-story-smoke.log; then
            echo "Story smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Story route smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/story_route_smoke.gd 2>&1 | tee godot-story-route.log
          grep -Fq "BLACKROOT STORY ROUTE SMOKE PASSED" godot-story-route.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|BLACKROOT STORY ROUTE SMOKE FAILED" godot-story-route.log; then
            echo "Story route smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Story runtime smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/story_runtime_smoke.gd 2>&1 | tee godot-story-runtime.log
          grep -Fq "BLACKROOT STORY RUNTIME SMOKE PASSED" godot-story-runtime.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT STORY RUNTIME SMOKE FAILED" godot-story-runtime.log; then
            echo "Story runtime smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Desktop input framework smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/input_framework_smoke.gd 2>&1 | tee godot-input-smoke.log
          grep -Fq "BLACKROOT INPUT FRAMEWORK SMOKE PASSED" godot-input-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT INPUT FRAMEWORK SMOKE FAILED" godot-input-smoke.log; then
            echo "Input framework smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Automated gameplay smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/gameplay_smoke.gd 2>&1 | tee godot-gameplay-smoke.log
          grep -Fq "BLACKROOT GAMEPLAY SMOKE PASSED" godot-gameplay-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT GAMEPLAY SMOKE FAILED" godot-gameplay-smoke.log; then
            echo "Gameplay smoke emitted an engine or assertion failure"
            exit 1
          fi

      - name: Repeated run-state stress
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script tests/run_state_stress.gd 2>&1 | tee godot-run-stress.log
          grep -Fq "BLACKROOT RUN STATE STRESS PASSED" godot-run-stress.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to create an autoload|Failed loading resource|BLACKROOT RUN STATE STRESS FAILED" godot-run-stress.log; then
            echo "Run-state stress emitted an engine or assertion failure"
            exit 1
          fi

      - name: Export Windows release build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" "build/windows/BlackrootHollow.exe" 2>&1 | tee godot-windows-export.log
          test -f build/windows/BlackrootHollow.exe
          test -f build/windows/BlackrootHollow.pck
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Project export .* failed|Failed to load script|Failed loading resource" godot-windows-export.log; then
            echo "Windows export emitted an engine/parser/resource error"
            exit 1
          fi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackrootHollow-Windows
          path: build/windows/
          if-no-files-found: error
